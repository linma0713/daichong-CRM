server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # 附件单个 10 MB，加上表单开销留点余量
  client_max_body_size 12m;
  server_tokens off;

  # 安全响应头。注意：location 里一旦写了 add_header，这里的就不再继承，所以下面两个 location 里各写了一遍
  # Referrer-Policy same-origin：客户从付款页跳到别的网站时，不把带随机串的付款链接带过去
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy same-origin always;

  # 接口请求转给后端容器；后端按 X-Forwarded-For 记录员工的真实 IP
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 带哈希的静态资源可以长期缓存
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # 前端路由：找不到的路径都返回 index.html
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    try_files $uri $uri/ /index.html;
  }
}
