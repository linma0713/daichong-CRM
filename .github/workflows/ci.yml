name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 检查与测试
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm_ci_password
          POSTGRES_DB: crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://crm:crm_ci_password@localhost:5432/crm_test?schema=public
      DATABASE_URL: postgresql://crm:crm_ci_password@localhost:5432/crm_test?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 生成 Prisma Client
        run: pnpm --filter @crm/api exec prisma generate

      - name: 格式检查
        run: pnpm format:check
      - name: 类型检查
        run: pnpm typecheck
      - name: 单元测试
        run: pnpm test
      - name: 接口测试（真实 PostgreSQL）
        run: pnpm test:e2e
      - name: 接口文档和前端类型是否已更新
        run: |
          pnpm api:gen
          git diff --exit-code -- apps/api/openapi.json apps/admin/src/api/schema.d.ts \
            || (echo "::error::接口有改动但没有重新生成，请在本地运行 pnpm api:gen 并提交" && exit 1)
      - name: 构建
        run: pnpm build

  docker:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 准备 .env
        run: cp .env.example .env
      - name: 构建镜像
        run: docker compose build
